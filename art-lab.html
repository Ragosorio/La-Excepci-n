<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Excepción — Art Lab</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital@0;1&display=swap');
      :root {
        --night: #1a1024;
        --deep: #0d0714;
        --gold: #d9b36c;
        --ivory: #f3ead8;
        --violet: #9b5cff;
        --cyan: #7fe3ff;
        --blood: #e2455b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--deep); color: var(--ivory); font-family: 'EB Garamond', serif; }
      header { padding: 18px 24px; border-bottom: 1px solid #2a1c3a; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; background: rgba(13, 7, 20, 0.94); z-index: 5; }
      header h1 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.2em; margin: 0; color: var(--gold); }
      header nav a { color: var(--ivory); opacity: 0.75; margin-right: 12px; text-decoration: none; font-size: 15px; }
      header nav a:hover { opacity: 1; color: var(--cyan); }
      main { padding: 12px 24px 80px; }
      section { margin: 28px 0 40px; }
      h2 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 0.14em; font-size: 20px; border-bottom: 1px solid #2a1c3a; padding-bottom: 6px; }
      h3 { font-family: 'Cinzel', serif; color: #cbb8ff; font-size: 14px; letter-spacing: 0.1em; margin: 18px 0 8px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .cell { background: radial-gradient(circle at 50% 40%, #2a1a3c 0%, #160d22 70%); border: 1px solid #2a1c3a; border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; color: #bfb3cf; }
      .cell.plain { background: #140c1e; }
      .cell svg, .cell canvas { display: block; margin: 0 auto 4px; }
      .cell .lbl { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .icons .cell { width: 86px; }
      .icons .cell svg { color: var(--ivory); }
      .checker { background-color: #1c1428; background-image: linear-gradient(45deg, #241a32 25%, transparent 25%), linear-gradient(-45deg, #241a32 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #241a32 75%), linear-gradient(-45deg, transparent 75%, #241a32 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
      .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
      .note { color: #9a8fb0; font-style: italic; font-size: 14px; }
      .big .cell { padding: 10px; }
      select, button { background: #1d1229; color: var(--ivory); border: 1px solid #3a2a4e; border-radius: 6px; padding: 4px 8px; font-family: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1>LA EXCEPCIÓN · ART LAB</h1>
      <nav id="nav"></nav>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/ui/art/lab.ts"></script>
  </body>
</html>
